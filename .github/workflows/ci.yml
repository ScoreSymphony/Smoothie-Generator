name: Mobile CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  mobile-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install

      - name: Validate Expo dependency compatibility
        run: npx expo install --check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Validate Android bundle
        run: npx expo export --platform android --output-dir dist/android
