name: Mobile CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  mobile-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run mobile release audit
        run: npm run audit:release

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist/android

      - name: Build installable private Android APK
        run: npm run build:android:private

      - name: Read app version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: app-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage versioned Android APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/smoothie-generator-v${{ steps.app-version.outputs.version }}-android.apk"

      - name: Upload private Android APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: smoothie-generator-android-v${{ steps.app-version.outputs.version }}
          path: release/smoothie-generator-v${{ steps.app-version.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 30
