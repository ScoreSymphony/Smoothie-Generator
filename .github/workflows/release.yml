name: Publish Android Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - app.json
      - assets/branding/smoothie-generator-icon.png
      - docs/RELEASE_V*.md
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  publish-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read release metadata
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          test "$VERSION" = "$APP_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run mobile release audit
        run: npm run audit:release

      - name: Build standalone Android release APK
        run: npm run build:android:private

      - name: Verify embedded React Native bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q "assets/index.android.bundle"

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Stage versioned APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Smoothie-Generator-v${{ steps.release.outputs.version }}.apk"
          test -s "release/Smoothie-Generator-v${{ steps.release.outputs.version }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          APK="release/Smoothie-Generator-v${VERSION}.apk"
          NOTES="docs/RELEASE_V${VERSION}.md"
          test -f "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Smoothie Generator $TAG" \
            --notes-file "$NOTES"
